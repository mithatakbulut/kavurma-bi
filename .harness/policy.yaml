schema_version: 1
workflow: feature
limits:
  max_concurrent_runs: 2
  max_concurrent_per_project: 1
  max_repair_attempts: 3
  max_transient_attempts: 4
  max_run_minutes: 120
verification:
  require_current_head: true
  require_fresh_review: true
  required_checks: ["verify", "architecture", "security"]
  behavior_evidence: conditional
risk:
  protected_paths:
    - ".github/**"
    - ".harness/**"
    - "scripts/verify.sh"
    - "**/auth/**"
    - "**/billing/**"
    - "**/migrations/**"
  human_approval_at_or_above: R3
merge:
  auto_merge: false
  allowed_auto_merge_risks: []
  require_all_gates: true
  require_no_bypass: true
